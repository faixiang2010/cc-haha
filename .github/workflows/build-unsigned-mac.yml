name: Build Unsigned macOS App

on:
  workflow_dispatch:   # 只允许手动触发

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # --- 参考官方构建环境，安装 cu-helper 编译所需的系统依赖 ---
      - name: Install system dependencies for native builds
        run: |
          brew update
          brew install cmake ninja pkg-config
          # 如果后续报错提示缺少其他库，可以在此处继续添加
          # 例如：brew install openssl

      # --- 安装项目依赖（参考官方 CI 的修复提交）---
      - name: Install dependencies (root)
        run: bun install

      - name: Install dependencies (desktop)
        run: cd desktop && bun install

      - name: Install dependencies (adapters)
        run: cd adapters && bun install

      # --- 构建 macOS 包 ---
      - name: Build macOS package
        run: |
          cd desktop
          bun run electron:package

      # --- 上传构建产物 ---
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/build-artifacts/electron/*.dmg

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: desktop/build-artifacts/electron/*.zip
