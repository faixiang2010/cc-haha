name: Build Unsigned macOS App

on:
  workflow_dispatch:   # 只允许手动触发

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # --- 安装依赖 ---
      - name: Install dependencies (root)
        run: bun install

      - name: Install dependencies (desktop)
        run: cd desktop && bun install

      - name: Install dependencies (adapters)
        run: cd adapters && bun install

      # --- 核心：在 CI 运行时动态绕过 cu-helper 的签名报错 ---
      - name: Bypass cu-helper signature check
        run: |
          echo "Patched build.sh to bypass signature exit."
          # 找到 cu-helper 目录下的 build.sh，把报错退出 exit 1 改成正常退出 exit 0
          for file in $(find . -name "build.sh" -path "*cu-helper*"); do
            echo "Patching $file"
            sed -i '' 's/exit 1/exit 0/g' "$file"
          done

      # --- 构建 macOS 包 ---
      - name: Build macOS package
        run: |
          cd desktop
          bun run electron:package

      # --- 上传构建产物 ---
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/build-artifacts/electron/*.dmg

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: desktop/build-artifacts/electron/*.zip
